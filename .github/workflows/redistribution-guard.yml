name: Redistribution Guard

on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build_wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  guard:
    needs: build_wheel
    uses: OpenVoiceOS/gh-automations/.github/workflows/redistribution-guard.yml@feat/redistribution-guard
    with:
      artifact_name: dist
      scan_paths: dist
